name: Terraform Action Workflow Template

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bootstrap/**'
  pull_request:
    branches:
      - main
    paths:
      - 'bootstrap/**'

env:
  TF_VERSION:    "1.6.3"
  WORKING_DIR:   "bootstrap"
  ENVIRONMENT:   "dev"
  TFSEC_VERSION: "1.28.6"

jobs:

# ─────────────────────────────────────────────────────────────────────────────
# PLAN — Runs on every PR and push to main
# ─────────────────────────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key for private module access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_TERRAFORM_MODULES_SSH_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # ── Install tfsec ──────────────────────────────────────────────
      - name: Install tfsec
        run: |
          wget -q https://github.com/aquasecurity/tfsec/releases/download/v${{ env.TFSEC_VERSION }}/tfsec-linux-amd64 -O tfsec
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/tfsec
          tfsec --version

      # ── Run tfsec and print results in logs ───────────────────────
      # soft-fail means pipeline will NOT stop if issues are found
      # Change --soft-fail to hard fail if you want pipeline to stop
      - name: Run tfsec scan
        run: |
          echo "scanning directory: $(pwd)"
          tfsec . --soft-fail
          echo "tfsec scan complete"

      # ── Save results as SARIF for GitHub Security tab ─────────────
      - name: Save tfsec SARIF report
        if: always()
        run: |
          tfsec . --format sarif --soft-fail > tfsec.sarif || true

      # ── Upload to GitHub Security tab ─────────────────────────────
      # View at: Repo > Security > Code Scanning Alerts
      - name: Upload tfsec results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec.sarif

      # ── Save report as downloadable artifact ──────────────────────
      - name: Save tfsec report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfsec-report
          path: tfsec.sarif
          retention-days: 30

      # ── Terraform steps run after tfsec ───────────────────────────
      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=environments/${{ env.ENVIRONMENT }}.tfvars -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan

# ─────────────────────────────────────────────────────────────────────────────
# APPLY — Runs ONLY when merged to main
# ─────────────────────────────────────────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key for private module access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_TERRAFORM_MODULES_SSH_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Terraform Init
        run: terraform init

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply tfplan
